    <ellipse cx="344" cy="640" rx="72" ry="52" transform="rotate(-20 344 640)"/>
    <ellipse cx="568" cy="504" rx="72" ry="52" transform="rotate(-20 568 504)"/>
    <rect x="404" y="300" width="22" height="294"/>
    <rect x="628" y="300" width="22" height="160"/>
    <rect x="404" y="300" width="246" height="42"/>
  </g>
</svg>